# === Apple / iphone 18 — US ===
# position_change test: latest=1, previous=4 → change=3
apple_iphone18_us_latest:
  keyword: apple_iphone18
  keyword_target: apple_iphone18
  search_run: apple_iphone18_us_latest
  query: iphone 18
  position: 1
  url: https://apple.com/iphone-18
  status: success
  location: us
  checked_at: <%= 2.days.ago.to_fs(:db) %>
  ai_overview_present: true
  ai_overview_cited: true
  ai_overview_citation_position: 2

